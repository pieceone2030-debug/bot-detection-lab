name: Bot Detection Lab

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: true
        default: 'campaign'
        type: choice
        options: [single, parallel, sequential, distributed, campaign, auto]
      count:
        description: 'Bots'
        required: true
        default: '12'
        type: string
      parallelism:
        description: 'Concurrent (parallel mode)'
        required: true
        default: '3'
        type: string
      window:
        description: 'Window (minutes)'
        required: true
        default: '45'
        type: string

  # تشغيل تلقائي عبر Cron — كل 3 ساعات
  schedule:
    - cron: '15 */3 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install packages
        run: npm install

      - name: Install Patchright Chromium
        run: npx patchright install --with-deps chromium

      - name: Run bots
        env:
          TARGET_URL: https://pog01.blogspot.com/
          BOT_MODE: ${{ github.event.inputs.mode || 'auto' }}
          BOT_COUNT: ${{ github.event.inputs.count || '12' }}
          PARALLELISM: ${{ github.event.inputs.parallelism || '3' }}
          WINDOW_MINUTES: ${{ github.event.inputs.window || '45' }}
          MAX_DURATION_MINUTES: '55'
          MAX_PER_IP: '2'
          CRON_MIN_GAP_MINUTES: '20'
          PROXIES_JSON: ${{ secrets.PROXIES_JSON }}
        run: npm test

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.run_id }}
          path: |
            screenshots/
            .bot-state/
          retention-days: 3
