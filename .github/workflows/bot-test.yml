name: Bot Detection Lab

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: true
        default: 'auto'
        type: choice
        options:
          - single
          - parallel
          - sequential
          - distributed
          - campaign
          - auto
      count:
        description: 'Bots count'
        required: true
        default: '15'
        type: string
      parallelism:
        description: 'Concurrent bots (parallel mode)'
        required: true
        default: '3'
        type: string
      window:
        description: 'Window in minutes (distributed/campaign)'
        required: true
        default: '40'
        type: string

  # تشغيل تلقائي كل ساعة
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read
  actions: read

jobs:
  run-bots:
    name: Run bot session
    runs-on: ubuntu-latest
    timeout-minutes: 60

    concurrency:
      group: bot-detection-lab
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install npm packages
        run: npm install

      - name: Install Patchright Chromium
        run: npx patchright install --with-deps chromium

      # استعادة الـ State من آخر تشغيل
      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: |
            .bot-state
            .geo-cache
          key: bot-state-${{ github.run_id }}
          restore-keys: |
            bot-state-
            geo-cache-

      # تأخير عشوائي لمنع التزامن مع cron-runs الأخرى
      - name: Random jitter
        run: |
          JITTER=$((RANDOM % 180))
          echo "Sleeping ${JITTER}s..."
          sleep $JITTER

      - name: Run bots
        env:
          TARGET_URL: 'https://pog01.blogspot.com/'
          BOT_MODE:   ${{ github.event.inputs.mode        || 'auto' }}
          BOT_COUNT:  ${{ github.event.inputs.count       || '15' }}
          PARALLELISM: ${{ github.event.inputs.parallelism || '3' }}
          WINDOW_MINUTES: ${{ github.event.inputs.window  || '40' }}
          MAX_DURATION_MINUTES: '55'
          MAX_PER_IP: '2'
          CRON_MIN_GAP_MINUTES: '45'
          MIN_GAP_SECONDS: '15'
          MAX_GAP_SECONDS: '120'
          DWELL_MIN: '10'
          DWELL_MAX: '20'
          HEADLESS: 'true'
          SCREENSHOTS: 'true'
          SAVE_HTML: 'false'
          STATE_DIR: '.bot-state'
          GEO_CACHE_DIR: '.geo-cache'
          GEO_STRICT: 'true'
          PROXIES_JSON: ${{ secrets.PROXIES_JSON }}
        run: npm test

      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .bot-state
            .geo-cache
          key: bot-state-${{ github.run_id }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.run_id }}
          path: |
            screenshots/
            .bot-state/
            .geo-cache/
          retention-days: 3
          if-no-files-found: warn
